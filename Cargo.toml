[workspace]
members = [
    "bin/zlicenser-tui",
    "bin/zlicenser-gui/src-tauri",
    "bindings/python",
    "bindings/nodejs",
    "bindings/go",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
zlicenser-protocol = "0.3.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
zlicenser-protocol = { path = "../zlicenser-protocol" }

[package]
name = "zlicenser"
version = "0.1.2"
edition = "2021"
authors = ["ZAL Analytics <info@zal-analytics.ch>"]
description = "Client library for the zlicenser hardware-bound software licensing framework."
documentation = "https://docs.rs/zlicenser"
repository = "https://github.com/zal-analytics/zlicenser"
license = "Apache-2.0"
keywords = ["licensing", "hardware-fingerprint", "client", "drm", "zlicenser"]
categories = ["cryptography", "authentication"]
readme = "README.md"
publish = true

[dependencies]
zlicenser-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

figment = { version = "0.10", features = ["toml"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
insta = "1"
proptest = "1"
mockall = "0.13"
assert_cmd = "2"
